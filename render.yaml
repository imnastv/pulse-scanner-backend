services:
  - type: web
    name: pulse-scanner-backend
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SOLANA_RPC_URL
        value: https://rpc.solanatracker.io/public
      - key: SOLANA_WS_URL
        value: wss://rpc.solanatracker.io/public
      - key: ALERT_SCORE_THRESHOLD
        value: "85"
      - key: ALLOWED_ORIGIN
        value: https://pulse-pumpfun-scanner.contactnxstv.chatgpt.site
      - key: PUMP_PROGRAM_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

